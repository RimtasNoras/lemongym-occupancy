name: Log occupancy :10/:40

# Runs off-machine, so coverage survives the Mac being asleep or off.
# GitHub's scheduler is best-effort and often runs a few minutes late; this is
# a reliability floor under the 10-minute local launchd job, not a replacement.
on:
  schedule:
    - cron: '10,40 * * * *'   # ten past and twenty to (UTC)
  workflow_dispatch:          # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: log-occupancy
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and append reading
        run: ./log-occupancy.sh occupancy.csv

      - name: Rebuild report (recomputes gap estimates)
        run: python3 build-report.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: git diff alone never reports an untracked file, so a
          # newly created CSV would look like "no change" and never be committed.
          git add occupancy.csv report.html
          if git diff --cached --quiet; then
            echo "No change, nothing to commit."
            exit 0
          fi
          git commit -m "Cloud reading $(TZ=Europe/Vilnius date '+%Y-%m-%d %H:%M')"
          # Another run may have pushed while this one was fetching.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
