const P = DATA.points, HR = DATA.hourly;
const M0 = P[0].m, M1 = P[P.length-1].m;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtH = m => String(Math.floor(m/60)%24).padStart(2,'0') + ':00';
const fmtDay = p => { const [, mo, d] = p.d.split('-'); return `${p.w} ${+d} ${MONTHS[+mo-1]}`; };

const peak = P.reduce((a,b) => b.v > a.v ? b : a);

const prev = P[P.length-2] || last;

/* day segments, for dividers and axis labels */
const DAYS = [];
for (const p of P) {
  let s = DAYS.find(x => x.d === p.d);
  if (!s) { s = {d:p.d, w:p.w, m0:p.m, m1:p.m, label:fmtDay(p)}; DAYS.push(s); }

}

/* ---------- Chart 1: full timeline ---------- */
(function () {
  const W=1000, H=360, ML=44, MR=18, MT=26, MB=44;
  const YMAX = Math.max(10, Math.ceil((peak.v + 6) / 10) * 10);
  const x = m => ML + (m - M0) / (M1 - M0) * (W - ML - MR);
  const y = v => MT + (1 - v / YMAX) * (H - MT - MB);

  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`, role:'img',
    'aria-label':`Line chart of gym occupancy across ${P.length} readings, peaking at ${peak.v} percent and bottoming at ${low.v} percent.`});

  const grad = el('linearGradient', {id:'g1', x1:'0', y1:'0', x2:'0', y2:'1'});
  grad.appendChild(el('stop', {offset:'0%',  'stop-color':'var(--series-1)', 'stop-opacity':'0.20'}));
  grad.appendChild(el('stop', {offset:'100%','stop-color':'var(--series-1)', 'stop-opacity':'0.02'}));
  const defs = el('defs'); defs.appendChild(grad); svg.appendChild(defs);

  /* overnight bands: 23:00 -> 06:00 of each night inside the range */
  for (let base = -1440; base <= M1; base += 1440) {
    const s = Math.max(base + 1380, M0), e = Math.min(base + 1800, M1);
    if (e <= s) continue;
    svg.appendChild(el('rect', {x:x(s), y:MT, width:x(e)-x(s), height:H-MT-MB, fill:'var(--night)'}));
    if (x(e) - x(s) > 70) {
      const bl = el('text', {x:(x(s)+x(e))/2, y:MT+14, 'text-anchor':'middle', class:'band-label'});
      bl.textContent = 'OVERNIGHT'; svg.appendChild(bl);
    }
  }

  const step = YMAX <= 40 ? 10 : 20;
  for (let v = 0; v <= YMAX; v += step) {
    svg.appendChild(el('line', {x1:ML, y1:y(v), x2:W-MR, y2:y(v), class: v===0 ? 'axisline' : 'gridline'}));
    const t = el('text', {x:ML-9, y:y(v)+4, 'text-anchor':'end', class:'tick'});
    t.textContent = v + '%'; svg.appendChild(t);
  }

  const tickStep = (M1 - M0) > 1500 ? 180 : 120;
  for (let m = Math.ceil(M0/60)*60; m <= M1; m += tickStep) {
    const t = el('text', {x:x(m), y:H-MB+18, 'text-anchor':'middle', class:'tick'});
    t.textContent = fmtH(m); svg.appendChild(t);
  }

  DAYS.forEach((s,i) => {
    if (i > 0) svg.appendChild(el('line', {x1:x(s.m0), y1:MT, x2:x(s.m0), y2:H-MB, class:'gridline'}));
    const t = el('text', {x:(x(s.m0)+x(s.m1))/2, y:H-MB+34, 'text-anchor':'middle', class:'axis-title'});
    t.textContent = s.label; svg.appendChild(t);
  });

  /* Break the stroke wherever readings stop for more than 45 min: a straight
     line across a logger outage would read as measured data, which it is not. */
  const GAP = 45;
  const d = P.map((p,i) =>
    ((i === 0 || p.m - P[i-1].m > GAP) ? 'M' : 'L') +
    x(p.m).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  /* One closed area per contiguous run, so gaps stay empty under the curve. */
  let run = [];
  const runs = [];
  P.forEach((p,i) => {
    if (i > 0 && p.m - P[i-1].m > GAP) { runs.push(run); run = []; }
    run.push(p);
  });
  runs.push(run);
  runs.filter(r => r.length > 1).forEach(r => {
    const seg = r.map((p,i) => (i?'L':'M') + x(p.m).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ')
      + ` L ${x(r[r.length-1].m).toFixed(1)} ${y(0)} L ${x(r[0].m).toFixed(1)} ${y(0)} Z`;
    svg.appendChild(el('path', {d: seg, fill:'url(#g1)'}));
  });
  svg.appendChild(el('path', {d, class:'series-line', 'vector-effect':'non-scaling-stroke'}));

  /* selective direct labels only: the peak and the floor */
  [[peak, peak.v + '% peak', `${peak.w} ${peak.t}`, -18],
   [low,  low.v  + '% floor', `${low.w} ${low.t}`,  -30]].forEach(([pt,lab,sub,dy]) => {
    const cx = Math.min(Math.max(x(pt.m), ML+34), W-MR-34);
    svg.appendChild(el('circle', {cx:x(pt.m), cy:y(pt.v), r:4.5, fill:'var(--series-1)',
      stroke:'var(--surface-1)', 'stroke-width':2}));
    const a = el('text', {x:cx, y:y(pt.v)+dy, 'text-anchor':'middle', class:'anno-label'});
    a.textContent = lab; svg.appendChild(a);
    const b = el('text', {x:cx, y:y(pt.v)+dy+13, 'text-anchor':'middle', class:'anno-sub'});
    b.textContent = sub; svg.appendChild(b);
  });

  const cross = el('line', {y1:MT, y2:H-MB, class:'crosshair', opacity:0});
  const dot = el('circle', {r:5, fill:'var(--series-1)', stroke:'var(--surface-1)', 'stroke-width':2, opacity:0});
  svg.appendChild(cross); svg.appendChild(dot);
  const host = document.getElementById('host1'), tip = document.getElementById('tip1');
  host.insertBefore(svg, tip);

  const move = ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / r.width * W;
    if (mx < ML || mx > W-MR) { cross.setAttribute('opacity',0); dot.setAttribute('opacity',0); tip.style.opacity=0; return; }
    let best = P[0], bd = 1e9;
    for (const p of P) { const dd = Math.abs(x(p.m)-mx); if (dd < bd) { bd = dd; best = p; } }
    cross.setAttribute('x1', x(best.m)); cross.setAttribute('x2', x(best.m)); cross.setAttribute('opacity',1);
    dot.setAttribute('cx', x(best.m)); dot.setAttribute('cy', y(best.v)); dot.setAttribute('opacity',1);
    tip.innerHTML = `<div class="tv">${best.v}%</div><div class="tt">${best.w} ${best.t}</div>`;
    const px = x(best.m) / W * r.width;
    tip.style.left = Math.min(Math.max(px - 34, 0), r.width - 92) + 'px';
    tip.style.top = (y(best.v) / H * r.height - 54) + 'px';
    tip.style.opacity = 1;
  };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', () => { cross.setAttribute('opacity',0); dot.setAttribute('opacity',0); tip.style.opacity=0; });
})();

(function () {

  HR.forEach(h => {
    const i = slotOf(h);
    const bx = ML + i*bw + 1, w = Math.max(bw - 2, 1);   /* 2px surface gap */
    svg.appendChild(el('rect', {x:bx, y:y(h.avg), width:w,
      height:Math.max(y(0)-y(h.avg), 2), rx:4, class:'bar'}));
    if (i % labelEvery === 0) {
      const t = el('text', {x:bx + w/2, y:H-MB+18, 'text-anchor':'middle', class:'tick'});
      t.textContent = fmtH(h.m); svg.appendChild(t);
    }
  });

  const host = document.getElementById('host2'), tip = document.getElementById('tip2');
  host.insertBefore(svg, tip);
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.floor(((ev.clientX - r.left) / r.width * W - ML) / bw);
    const h = HR.find(x => slotOf(x) === i);
    if (i < 0 || i >= slots || !h) { tip.style.opacity = 0; return; }
    tip.innerHTML = `<div class="tv">${h.avg}%</div><div class="tt">${fmtH(h.m)} &middot; ${h.n} readings &middot; ${h.min}–${h.max}%</div>`;
    const px = (ML + slotOf(h)*bw + bw/2) / W * r.width;
    tip.style.left = Math.min(Math.max(px - 70, 0), r.width - 168) + 'px';
    tip.style.top = (y(h.avg) / H * r.height - 56) + 'px';
    tip.style.opacity = 1;
  });
  svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
})();

/* ---------- Table ---------- */
(function () {
  let p0 = null;
  document.querySelector('#tbl tbody').innerHTML = P.map(p => {
    const d = p0 === null ? '' : (p.v > p0 ? '+' + (p.v-p0) : (p.v < p0 ? (p.v-p0) : '='));
    p0 = p.v;
    return `<tr><td>${p.w}</td><td>${p.t}</td><td class="num">${p.v}%</td><td class="num">${d}</td></tr>`;
  }).join('');
})();
</script>
